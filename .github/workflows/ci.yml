name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: docker build -t pubship/website:ci .
      - name: Check Nginx and browser behavior in the production image
        shell: bash
        run: |
          docker run --rm --entrypoint nginx pubship/website:ci -t
          docker run --detach --name pubship-site-ci --publish 127.0.0.1:4180:8080 pubship/website:ci
          trap 'docker stop pubship-site-ci >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4180/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4180/healthz
          SITE_TEST_URL=http://127.0.0.1:4180 npm test
