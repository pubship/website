server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    # HTTPS terminates at Coolify. Directory redirects must retain its public origin.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # No request URLs, queries, IP addresses or referrers are logged by this image.
    access_log off;
    error_log /dev/stderr crit;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /.well-known/security.txt { default_type text/plain; try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
